<!--
  DAP SPC — visualens ikon.

  Motivet er en serie med seks observationer i træk over centerlinjen
  efterfulgt af et fald under den: en usædvanligt lang serie, som er det
  ene af de to signaler runs-analysen leder efter.

  Farven står ét sted, i variablen nedenfor. Ændres den, skal begge PNG'er
  genereres igen — se assets/README.md.

  Stregvægtene er sat efter 20x20, hvor ikonet reelt vises. Centerlinjen
  ville forsvinde ved den vægt, motivet har i en webkontekst.
-->
