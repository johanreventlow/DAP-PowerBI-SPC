name: "Build release"
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build-pbiviz-packages:
    name: "Pre Release"
    runs-on: "ubuntu-latest"

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 10.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x

    - name: Label visuals as 'Development'
      run: |
        set -euo pipefail
        # Fail loudly rather than shipping a dev build under the production
        # guid if these ever drift out of sync with pbiviz.json again.
        grep -q '"name":"PBISPCRoest"' pbiviz.json
        grep -q '"displayName":"SPC RØST"' pbiviz.json
        grep -q '"guid":"PBISPCRoest"' pbiviz.json
        sed -i 's/"name":"PBISPCRoest"/"name":"PBISPCRoestDEV"/g' pbiviz.json
        sed -i 's/"displayName":"SPC RØST"/"displayName":"SPC RØST (Dev)"/g' pbiviz.json
        sed -i 's/"guid":"PBISPCRoest"/"guid":"PBISPCRoestDEV"/g' pbiviz.json
      shell: bash

    - name: Build
      run: |
        npm install
        npm install -g powerbi-visuals-tools@6.2.0
        pbiviz package

    - name : "Create Release"
      uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "latest"
        prerelease: false
        title: "Development Build"
        files: dist/*.pbiviz
